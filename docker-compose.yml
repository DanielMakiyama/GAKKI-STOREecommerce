services:
  db:
    image: postgres:16-alpine
    container_name: gakki-db
    environment:
      POSTGRES_DB: gakki
      POSTGRES_USER: gakki
      POSTGRES_PASSWORD: gakki
    ports:
      - "5432:5432"
    volumes:
      - gakki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gakki -d gakki"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gakki-pgdata:
