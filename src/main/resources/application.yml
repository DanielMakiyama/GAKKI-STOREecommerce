spring:
  application:
    name: gakki-store

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gakki}
    username: ${DB_USERNAME:gakki}
    password: ${DB_PASSWORD:gakki}

  jpa:
    # Sem sessão aberta na camada de view: LazyInitializationException
    # aparece no teste, e não em produção com o cliente na frente.
    open-in-view: false
    hibernate:
      # O schema é do Flyway. O Hibernate apenas confere se as entidades
      # batem com as tabelas — e derruba o boot se divergirem.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # A massa de demonstração é a V999 de propósito: assim ela roda
    # sempre depois de toda migration de estrutura, e nenhuma tabela
    # nova obriga a renumerar o seed.
    #
    # A consequência é esta: toda migration de estrutura criada depois
    # dela nasce "fora de ordem" para o Flyway, porque o número é menor
    # que o 999 já aplicado. Sem esta linha o boot falha com "Detected
    # resolved migration not applied to database". É o preço da
    # convenção, e esta é a linha que a faz funcionar.
    out-of-order: true

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # O front monta as URLs como VITE_API_URL + "/clientes". Com o prefixo
  # aqui, os controllers ficam limpos: @RequestMapping("/clientes").
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: never

gakki:
  jwt:
    # Sem default de propósito: a aplicação não sobe sem a variável de
    # ambiente definida, o que impede uma chave de desenvolvimento
    # vazar para produção por esquecimento.
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  carrinho:
    # RN0044 — prazo de bloqueio do item no carrinho, reiniciado a cada
    # item incluído. ISO-8601: PT15M na demonstração, PT10S quando se
    # quer ver a expiração acontecer sem esperar.
    prazo-bloqueio: ${CARRINHO_PRAZO_BLOQUEIO:PT15M}
  pagamento:
    # RN0037 — a operadora de cartão é simulada nesta etapa, como o
    # próprio DRS autoriza em nota de rodapé. O critério de recusa é o
    # final do cartão: determinístico, para a demonstração poder exibir
    # uma compra REPROVADA quando quiser, e acionável pela tela, porque
    # o cliente cadastra o cartão por lá.
    digitos-recusados: ${PAGAMENTO_DIGITOS_RECUSADOS:0000}
  ia:
    # RNF0044 — modelo aberto servido pelo Ollama na própria máquina.
    url: ${IA_URL:http://localhost:11434}
    modelo-base: "${IA_MODELO_BASE:llama3.2:3b}"
    # 0 = só processador. Placas de vídeo antigas (ex.: AMD R9) geram texto corrompido.
    num-gpu: ${IA_NUM_GPU:0}
    # Janela de contexto em tokens: regras + catálogo + histórico + conversa.
    num-ctx: ${IA_NUM_CTX:4096}
    # Tamanho máximo da resposta em tokens (cerca de 4 frases).
    max-tokens: ${IA_MAX_TOKENS:220}
    temperatura: 0.3
    # Ao subir o backend, carrega o modelo e o catálogo antes da primeira pergunta.
    aquecer-na-inicializacao: ${IA_AQUECER:true}
    # Mantém o modelo na memória entre perguntas, evitando recarregar a cada uma.
    keep-alive: 30m
    # A primeira pergunta inclui carregar o modelo e ler o catálogo.
    timeout: ${IA_TIMEOUT:PT180S}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: ${LOG_SQL:INFO}
