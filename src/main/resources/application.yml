spring:
  application:
    name: gakki-store

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gakki}
    username: ${DB_USERNAME:gakki}
    password: ${DB_PASSWORD:gakki}

  jpa:
    # Sem sessão aberta na camada de view: LazyInitializationException
    # aparece no teste, e não em produção com o cliente na frente.
    open-in-view: false
    hibernate:
      # O schema é do Flyway. O Hibernate apenas confere se as entidades
      # batem com as tabelas — e derruba o boot se divergirem.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # A massa de demonstração é a V999 de propósito: assim ela roda
    # sempre depois de toda migration de estrutura, e nenhuma tabela
    # nova obriga a renumerar o seed.
    #
    # A consequência é esta: toda migration de estrutura criada depois
    # dela nasce "fora de ordem" para o Flyway, porque o número é menor
    # que o 999 já aplicado. Sem esta linha o boot falha com "Detected
    # resolved migration not applied to database". É o preço da
    # convenção, e esta é a linha que a faz funcionar.
    out-of-order: true

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # O front monta as URLs como VITE_API_URL + "/clientes". Com o prefixo
  # aqui, os controllers ficam limpos: @RequestMapping("/clientes").
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: never

gakki:
  jwt:
    # Sem default de propósito: a aplicação não sobe sem a variável de
    # ambiente definida, o que impede uma chave de desenvolvimento
    # vazar para produção por esquecimento.
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pagamento:
    # RN0037 — a operadora de cartão é simulada nesta etapa, como o
    # próprio DRS autoriza em nota de rodapé. O critério de recusa é o
    # final do cartão: determinístico, para a demonstração poder exibir
    # uma compra REPROVADA quando quiser, e acionável pela tela, porque
    # o cliente cadastra o cartão por lá.
    digitos-recusados: ${PAGAMENTO_DIGITOS_RECUSADOS:0000}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: ${LOG_SQL:INFO}
